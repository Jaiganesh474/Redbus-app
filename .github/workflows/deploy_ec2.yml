name: redBus AWS EC2 CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Job 1: Build & Validate Backend and Frontend
  build-and-test:
    name: Build & Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Backend
        run: |
          cd backend
          mvn clean compile -DskipTests

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Next.js Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # Job 2: Deploy to AWS EC2 over SSH
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            if [ ! -d "/home/ubuntu/Redbus-app" ]; then
              echo "Cloning repository..."
              git clone https://github.com/Jaiganesh474/Redbus-app.git /home/ubuntu/Redbus-app
            fi
            chmod +x /home/ubuntu/Redbus-app/deploy/deploy.sh
            /home/ubuntu/Redbus-app/deploy/deploy.sh
