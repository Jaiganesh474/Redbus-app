name: Build RedBus AI Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug & Release Signed APK
        run: gradle assembleDebug assembleRelease

      - name: Upload RedBus AI Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RedBus-AI-Android-Debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload RedBus AI Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RedBus-AI-Android-Release-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk

